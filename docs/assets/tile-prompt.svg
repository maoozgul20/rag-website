<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 92" width="232" height="92" role="img" aria-label="Prompt"><title>Prompt</title><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#57534e;font-size:13.5px}.t{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:18px;fill:#1c1917}.n{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}@keyframes p{0%,70%,100%{stroke-opacity:0;r:13px}20%{stroke-opacity:.9;r:13px}60%{stroke-opacity:0;r:21px}}.p{animation:p 4s 2.5s ease-out infinite;stroke-opacity:0}@media (prefers-reduced-motion:reduce){*{animation:none!important}.packet{display:none}.static{display:block!important}.moving{display:none}}</style><rect x="5" y="5" width="222" height="82" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.3"/><circle class="p" cx="34" cy="34" r="13" fill="none" stroke="#c2410c" stroke-width="2"/><circle cx="34" cy="34" r="13" fill="#c2410c"/><text class="n" x="34" y="38.5" >6</text><text class="t" x="56" y="40">Prompt</text><text x="20" y="69">Grounded context</text><text x="212" y="69" text-anchor="end" style="fill:#c2410c;font-size:15px;font-weight:700">↓</text></svg>
