}41.40%,53.95%{opacity:1}54.55%,100%{opacity:0}}#c4{animation:c4 20s linear infinite}@keyframes h5{0%,53.35%{opacity:0}53.95%,63.15%{opacity:1}63.75%,100%{opacity:0}}#h5{animation:h5 20s linear infinite}@keyframes c5{0%,53.35%{opacity:0}53.95%,66.49%{opacity:1}67.09%,100%{opacity:0}}#c5{animation:c5 20s linear infinite}@keyframes h6{0%,65.89%{opacity:0}66.49%,75.69%{opacity:1}76.29%,100%{opacity:0}}#h6{animation:h6 20s linear infinite}@keyframes c6{0%,65.89%{opacity:0}66.49%,79.04%{opacity:1}79.64%,100%{opacity:0}}#c6{animation:c6 20s linear infinite}@keyframes h7{0%,78.44%{opacity:0}79.04%,88.24%{opacity:1}88.84%,100%{opacity:0}}#h7{animation:h7 20s linear infinite}@keyframes c7{0%,78.44%{opacity:0}79.04%,100%{opacity:1}}#c7{animation:c7 20s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.packet{display:none}.static{display:block!important}.moving{display:none}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9z" fill="#8c867e"/></marker></defs><rect x=".75" y=".75" width="958.5" height="546.5" rx="16" fill="#f7f5f0" stroke="#e4ded3" stroke-width="1.5"/><text class="lane" x="24" y="40">EVERY QUESTION · ONE VERCEL FUNCTION, ONE EXTERNAL API</text><rect x="12" y="326" width="912" height="140" rx="14" fill="none" stroke="#d2cabc" stroke-dasharray="4 5"/><text class="lane" x="24" y="352">BUILT ONCE ON YOUR COMPUTER · python build_index.py</text><path class="flow" d="M210,100.0 H254" marker-end="url(#a)"/><path class="flow" d="M444,100.0 H488" marker-end="url(#a)"/><path class="flow" d="M678,100.0 H722" marker-end="url(#a)"/><path class="flow" d="M819.0,142 V210" marker-end="url(#a)"/><path class="flow" d="M726,256.0 H682" marker-end="url(#a)"/><path class="flow" d="M492,256.0 H448" marker-end="url(#a)"/><path class="flow" d="M258,256.0 H214" marker-end="url(#a)"/><path class="flow" d="M117.0,214 V146" marker-end="url(#a)"/><path class="flow" d="M351.0,142 V210" marker-end="url(#a)"/><path class="flow" d="M210,410.0 H254" marker-end="url(#a)"/><path class="flow" d="M444,410.0 H488" marker-end="url(#a)"/><path class="flow" d="M678,410.0 H722" marker-end="url(#a)"/><path class="flow" d="M912,410.0 H940 V100.0 H916" marker-end="url(#a)"/><text x="361.0" y="182.0">question only, for compare</text><text x="127.0" y="182.0">renders</text><text transform="translate(953,313.0) rotate(-90)">loaded at cold start</text><circle class="packet" r="4" fill="#c2410c" opacity="0.45"><animateMotion path="M117.0,100.0 H819.0 V256.0 H117.0 V100.0" dur="20s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.92;1" keyPoints="0;1;1"/></circle><circle class="packet" r="5" fill="#c2410c" opacity="0.7"><animateMotion path="M117.0,100.0 H819.0 V256.0 H117.0 V100.0" dur="20s" begin="-0.12s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.92;1" keyPoints="0;1;1"/></circle><circle class="packet" r="6.5" fill="#c2410c" opacity="1"><animateMotion path="M117.0,100.0 H819.0 V256.0 H117.0 V100.0" dur="20s" begin="-0.24s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.92;1" keyPoints="0;1;1"/></circle><circle class="packet" r="5.5" fill="#57534e" opacity="1"><animateMotion path="M351.0,100.0 V256.0" dur="20s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6209;0.7109;1" keyPoints="0;0;1;1"/></circle><circle class="packet" r="4" fill="#15803d" opacity="0.5"><animateMotion path="M117.0,410.0 H940 V100.0 H819.0" dur="10s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;1" keyPoints="0;1"/></circle><circle class="packet" r="5.5" fill="#15803d" opacity="1"><animateMotion path="M117.0,410.0 H940 V100.0 H819.0" dur="10s" begin="-0.14s" repeatCount="indefinite" calcMode="linear" keyTimes="0;1" keyPoints="0;1"/></circle><rect x="24" y="58" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><rect id="h0" class="hl" x="24" y="58" width="186" height="84" rx="12"/><circle cx="46" cy="81" r="11" fill="#c2410c"/><text class="n" x="46" y="85.5">1</text><text class="t" x="64" y="86.5">React UI</text><text class="m" x="37" y="112">src/ · Vite + KaTeX</text><text x="37" y="130">chat, sources, compare</text><rect x="258" y="58" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><rect id="h1" class="hl" x="258" y="58" width="186" height="84" rx="12"/><circle cx="280" cy="81" r="11" fill="#c2410c"/><text class="n" x="280" y="85.5">2</text><text class="t" x="298" y="86.5">FastAPI</text><text class="m" x="271" y="112">backend/app.py</text><text x="271" y="130">POST /api/ask</text><rect x="492" y="58" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><rect id="h2" class="hl" x="492" y="58" width="186" height="84" rx="12"/><circle cx="514" cy="81" r="11" fill="#c2410c"/><text class="n" x="514" y="85.5">3</text><text class="t" x="532" y="86.5">Embed question</text><text class="m" x="505" y="112">all-MiniLM-L6-v2 (ONNX)</text><text x="505" y="130">one 384-d vector</text><rect x="726" y="58" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><rect id="h3" class="hl" x="726" y="58" width="186" height="84" rx="12"/><circle cx="748" cy="81" r="11" fill="#c2410c"/><text class="n" x="748" y="85.5">4</text><text class="t" x="766" y="86.5">Index search</text><text class="m" x="739" y="112">flatindex.py · NumPy</text><text x="739" y="130">+ TF-IDF in hybrid mode</text><rect x="726" y="214" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><rect id="h4" class="hl" x="726" y="214" width="186" height="84" rx="12"/><circle cx="748" cy="237" r="11" fill="#c2410c"/><text class="n" x="748" y="241.5">5</text><text class="t" x="766" y="242.5">Top-k passages</text><text class="m" x="739" y="268">text, source, score</text><text x="739" y="286">best under 0.4 = weak</text><rect x="492" y="214" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><rect id="h5" class="hl" x="492" y="214" width="186" height="84" rx="12"/><circle cx="514" cy="237" r="11" fill="#c2410c"/><text class="n" x="514" y="241.5">6</text><text class="t" x="532" y="242.5">Build prompt</text><text class="m" x="505" y="268">rag.py · build_prompt</text><text x="505" y="286">“use ONLY the context”</text><rect x="258" y="214" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><rect id="h6" class="hl" x="258" y="214" width="186" height="84" rx="12"/><circle cx="280" cy="237" r="11" fill="#c2410c"/><text class="n" x="280" y="241.5">7</text><text class="t" x="298" y="242.5">LLM on Groq</text><text class="m" x="271" y="268">llm.py · external API</text><text x="271" y="286">openai/gpt-oss-20b</text><rect x="24" y="214" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><rect id="h7" class="hl" x="24" y="214" width="186" height="84" rx="12"/><circle cx="46" cy="237" r="11" fill="#c2410c"/><text class="n" x="46" y="241.5">8</text><text class="t" x="64" y="242.5">Answer</text><text class="m" x="37" y="268">Markdown + math</text><text x="37" y="286">badge, sources, timing</text><rect x="24" y="368" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><circle cx="46" cy="391" r="11" fill="#1c1917"/><text class="n" x="46" y="395.5">A</text><text class="t" x="64" y="396.5">13 course notes</text><text class="m" x="37" y="422">backend/data/*.txt</text><text x="37" y="440">276,888 characters</text><rect x="258" y="368" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><circle cx="280" cy="391" r="11" fill="#1c1917"/><text class="n" x="280" y="395.5">B</text><text class="t" x="298" y="396.5">Chunker</text><text class="m" x="271" y="422">size 300 · overlap 50</text><text x="271" y="440">1,342 chunks</text><rect x="492" y="368" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><circle cx="514" cy="391" r="11" fill="#1c1917"/><text class="n" x="514" y="395.5">C</text><text class="t" x="532" y="396.5">Embed chunks</text><text class="m" x="505" y="422">same MiniLM model</text><text x="505" y="440">L2-normalised, 384-d</text><rect x="726" y="368" width="186" height="84" rx="12" fill="#fffefb" stroke="#d2cabc" stroke-width="1.2"/><circle cx="748" cy="391" r="11" fill="#1c1917"/><text class="n" x="748" y="395.5">D</text><text class="t" x="766" y="396.5">Saved index</text><text class="m" x="739" y="422">rag.index · tfidf.npz</text><text x="739" y="440">meta.json · committed</text><g class="moving"><text id="c0" class="cap c" x="480.0" y="520"><tspan font-weight="700" fill="#c2410c">1.</tspan> You type a question in the chat.</text><text id="c1" class="cap c" x="480.0" y="520"><tspan font-weight="700" fill="#c2410c">2.</tspan> The browser posts it to FastAPI at /api/ask, on the same Vercel URL.</text><text id="c2" class="cap c" x="480.0" y="520"><tspan font-weight="700" fill="#c2410c">3.</tspan> MiniLM turns the question into one vector of 384 numbers.</text><text id="c3" class="cap c" x="480.0" y="520"><tspan font-weight="700" fill="#c2410c">4.</tspan> NumPy compares that vector with all 1,342 stored chunks. Exact search.</text><text id="c4" class="cap c" x="480.0" y="520"><tspan font-weight="700" fill="#c2410c">5.</tspan> The top-k passages come back with scores. A best score under 0.4 is flagged.</text><text id="c5" class="cap c" x="480.0" y="520"><tspan font-weight="700" fill="#c2410c">6.</tspan> Passages and question become one prompt: answer only from this context.</text><text id="c6" class="cap c" x="480.0" y="520"><tspan font-weight="700" fill="#c2410c">7.</tspan> Groq answers it. The bare question is sent at the same moment, for comparison.</text><text id="c7" class="cap c" x="480.0" y="520"><tspan font-weight="700" fill="#c2410c">8.</tspan> You get the answer, its sources, a confidence badge and the comparison.</text></g><text class="cap static" x="480.0" y="520">Numbers follow one question. Letters are the one-time build.</text></svg>
